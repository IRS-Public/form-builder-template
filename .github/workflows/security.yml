name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # do not cancel redundant runs on main or release branches
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

env:
  SEMGREP_VERSION: 1.151.0
  COOKIECUTTER_VERSION: 2.6.0

jobs:

  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Semgrep and cookiecutter
        run: |
          python -m pip install --disable-pip-version-check \
            semgrep==${{ env.SEMGREP_VERSION }} \
            cookiecutter==${{ env.COOKIECUTTER_VERSION }}

      # Every feature on, so the scan sees every file the template can emit.
      - name: Render the template
        run: |
          mkdir -p "$RUNNER_TEMP/render"
          cookiecutter . --no-input --output-dir "$RUNNER_TEMP/render" project_name="CI Smoke"

      - name: Scan the generation hook and the rendered app
        run: |
          semgrep scan --metrics off --severity WARNING --error \
            --exclude node_modules --exclude vendor --exclude out --exclude target \
            --config p/security-audit \
            --config p/python \
            --config p/scala \
            --config p/javascript \
            hooks "$RUNNER_TEMP/render/ci-smoke"
